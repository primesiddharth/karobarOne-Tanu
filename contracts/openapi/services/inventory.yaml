openapi: 3.1.0
info:
  title: KarobarOne INVENTORY Service
  version: 0.1.0
paths:
  /health/live:
    get:
      summary: Health Live
      description: "Liveness probe returning 200 OK (RULES.md \xA71 C2)."
      operationId: health_live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      summary: Health Ready
      description: "Readiness probe verifying DB connectivity (RULES.md \xA71 C2)."
      operationId: health_ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /metrics:
    get:
      summary: Get Metrics
      description: "Internal Prometheus metrics endpoint (RULES.md \xA712)."
      operationId: get_metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
  /internal/events:
    post:
      summary: Receive Internal Event
      description: Ingress endpoint for cross-service events per SECURITY_LAYER.md.
      operationId: receive_internal_event_internal_events_post
      parameters:
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/availability:
    get:
      summary: Read SKU availability
      operationId: INV_001
      security:
      - HTTPBearer: []
      parameters:
      - name: store_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Store Id
      - name: sku_ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
            format: uuid
          title: Sku Ids
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAvailabilityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/reservations:
    post:
      summary: Atomic stock reservation
      operationId: INV_002
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReservationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/reservations/{id}/consume:
    post:
      summary: Consume reservation
      operationId: INV_003
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumeReservationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/reservations/{id}/release:
    post:
      summary: Release reservation
      operationId: INV_004
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: reason
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseReservationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/adjustments:
    post:
      summary: Manual stock adjustment
      operationId: INV_005
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdjustmentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/stores/{store_id}/inventory:
    get:
      summary: Inventory view
      operationId: INV_006
      security:
      - HTTPBearer: []
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Store Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInventoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AdjustmentResponse:
      properties:
        adjustment_id:
          type: string
          format: uuid
          title: Adjustment Id
        sku_id:
          type: string
          format: uuid
          title: Sku Id
        adjustment_type:
          type: string
          title: Adjustment Type
        quantity:
          type: integer
          title: Quantity
        new_on_hand_qty:
          type: integer
          title: New On Hand Qty
        new_available_qty:
          type: integer
          title: New Available Qty
      additionalProperties: false
      type: object
      required:
      - adjustment_id
      - sku_id
      - adjustment_type
      - quantity
      - new_on_hand_qty
      - new_available_qty
      title: AdjustmentResponse
    ConsumeReservationResponse:
      properties:
        reservation_id:
          type: string
          format: uuid
          title: Reservation Id
        status:
          type: string
          title: Status
        consumed_at:
          type: string
          format: date-time
          title: Consumed At
        sku_id:
          type: string
          format: uuid
          title: Sku Id
        quantity:
          type: integer
          title: Quantity
      additionalProperties: false
      type: object
      required:
      - reservation_id
      - status
      - consumed_at
      - sku_id
      - quantity
      title: ConsumeReservationResponse
    CreateAdjustmentRequest:
      properties:
        store_id:
          type: string
          format: uuid
          title: Store Id
        sku_id:
          type: string
          format: uuid
          title: Sku Id
        adjustment_type:
          type: string
          enum:
          - INCREMENT
          - DECREMENT
          - SET
          title: Adjustment Type
        quantity:
          type: integer
          minimum: 0.0
          title: Quantity
        reason:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - store_id
      - sku_id
      - adjustment_type
      - quantity
      title: CreateAdjustmentRequest
    CreateReservationRequest:
      properties:
        store_id:
          type: string
          format: uuid
          title: Store Id
        checkout_id:
          type: string
          format: uuid
          title: Checkout Id
        lines:
          items:
            $ref: '#/components/schemas/ReservationLineRequest'
          type: array
          minItems: 1
          title: Lines
        ttl_seconds:
          anyOf:
          - type: integer
            maximum: 3600.0
            minimum: 30.0
          - type: 'null'
          title: Ttl Seconds
          default: 600
      additionalProperties: false
      type: object
      required:
      - store_id
      - checkout_id
      - lines
      title: CreateReservationRequest
    CreateReservationResponse:
      properties:
        reservation_group_id:
          type: string
          format: uuid
          title: Reservation Group Id
        reservations:
          items:
            $ref: '#/components/schemas/ReservationItemDto'
          type: array
          title: Reservations
      additionalProperties: false
      type: object
      required:
      - reservation_group_id
      - reservations
      title: CreateReservationResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InventoryAvailabilityResponse:
      properties:
        store_id:
          type: string
          format: uuid
          title: Store Id
        lines:
          items:
            $ref: '#/components/schemas/SkuAvailabilityDto'
          type: array
          title: Lines
      additionalProperties: false
      type: object
      required:
      - store_id
      - lines
      title: InventoryAvailabilityResponse
    InventoryItemDto:
      properties:
        sku_id:
          type: string
          format: uuid
          title: Sku Id
        sku_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Sku Code
        is_tracked:
          type: boolean
          title: Is Tracked
        on_hand_qty:
          type: integer
          title: On Hand Qty
        reserved_qty:
          type: integer
          title: Reserved Qty
        available_qty:
          type: integer
          title: Available Qty
        last_movement_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Movement At
      additionalProperties: false
      type: object
      required:
      - sku_id
      - is_tracked
      - on_hand_qty
      - reserved_qty
      - available_qty
      title: InventoryItemDto
    ReleaseReservationResponse:
      properties:
        reservation_id:
          type: string
          format: uuid
          title: Reservation Id
        status:
          type: string
          title: Status
        released_at:
          type: string
          format: date-time
          title: Released At
        sku_id:
          type: string
          format: uuid
          title: Sku Id
        quantity:
          type: integer
          title: Quantity
      additionalProperties: false
      type: object
      required:
      - reservation_id
      - status
      - released_at
      - sku_id
      - quantity
      title: ReleaseReservationResponse
    ReservationItemDto:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        sku_id:
          type: string
          format: uuid
          title: Sku Id
        quantity:
          type: string
          pattern: ^\d+(?:\.\d{1,3})?$
          title: Quantity
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - id
      - sku_id
      - quantity
      - expires_at
      title: ReservationItemDto
    ReservationLineRequest:
      properties:
        sku_id:
          type: string
          format: uuid
          title: Sku Id
        quantity:
          type: string
          pattern: ^\d+(?:\.\d{1,3})?$
          title: Quantity
          description: Quantity to reserve as a decimal string (max 3 decimal places).
      additionalProperties: false
      type: object
      required:
      - sku_id
      - quantity
      title: ReservationLineRequest
    SkuAvailabilityDto:
      properties:
        sku_id:
          type: string
          format: uuid
          title: Sku Id
        is_tracked:
          type: boolean
          title: Is Tracked
        on_hand_qty:
          type: integer
          title: On Hand Qty
        reserved_qty:
          type: integer
          title: Reserved Qty
        available_qty:
          type: integer
          title: Available Qty
        is_available:
          type: boolean
          title: Is Available
      additionalProperties: false
      type: object
      required:
      - sku_id
      - is_tracked
      - on_hand_qty
      - reserved_qty
      - available_qty
      - is_available
      title: SkuAvailabilityDto
    StoreInventoryResponse:
      properties:
        store_id:
          type: string
          format: uuid
          title: Store Id
        items:
          items:
            $ref: '#/components/schemas/InventoryItemDto'
          type: array
          title: Items
        total_count:
          type: integer
          title: Total Count
      additionalProperties: false
      type: object
      required:
      - store_id
      - items
      - total_count
      title: StoreInventoryResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
