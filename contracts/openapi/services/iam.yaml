openapi: 3.1.0
info:
  title: KarobarOne IAM Service
  version: 0.1.0
paths:
  /health/live:
    get:
      summary: Health Live
      description: "Liveness probe returning 200 OK (RULES.md \xA71 C2)."
      operationId: health_live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      summary: Health Ready
      description: "Readiness probe verifying DB connectivity (RULES.md \xA71 C2)."
      operationId: health_ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /internal/events:
    post:
      summary: Receive Internal Event
      description: Ingress endpoint for cross-service events per SECURITY_LAYER.md.
      operationId: receive_internal_event_internal_events_post
      parameters:
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/register:
    post:
      summary: Register
      description: Registers a new user principal and credentials; enumeration resistant
        (OQ-006).
      operationId: registerPrincipal
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      summary: Login
      description: Authenticates principal; supports transparent bcrypt verify-then-rehash
        to Argon2id (IAM-001).
      operationId: loginPrincipal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      summary: Refresh Session
      description: Rotates refresh token; detecting replay revokes the entire session
        (IAM-002, SEC-TST-007).
      operationId: refreshSession
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      summary: Logout
      description: Revokes active authenticated session (IAM-003).
      operationId: logoutSession
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/otp/challenges:
    post:
      summary: Create Otp Challenge
      description: Creates hashed OTP challenge; enforces attempt caps and sliding
        rate limits (IAM-004).
      operationId: createOtpChallenge
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpChallengeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/otp/challenges/{challenge_id}/verify:
    post:
      summary: Verify Otp Challenge
      description: Verifies OTP challenge; single-use semantics (IAM-005).
      operationId: verifyOtpChallenge
      parameters:
      - name: challenge_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Challenge Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me:
    get:
      summary: Get Me
      description: Returns authenticated principal profile and active scoped role
        assignments (IAM-006).
      operationId: getCurrentPrincipal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPrincipalResponse'
      security:
      - HTTPBearer: []
  /api/v1/admin/role-assignments:
    post:
      summary: Grant Role Assignment
      description: Grants scoped role assignment enforcing role check constraints
        and platform MFA (IAM-007).
      operationId: grantRoleAssignment
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/role-assignments/{assignment_id}:
    delete:
      summary: Revoke Role Assignment
      description: Revokes active role assignment (IAM-008).
      operationId: revokeRoleAssignment
      security:
      - HTTPBearer: []
      parameters:
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Assignment Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/.well-known/jwks.json:
    get:
      summary: Get Jwks
      description: "Exposes current and previous public RSA keys in standard JWKS\
        \ format (RULES \xA78)."
      operationId: getJwks
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
  /.well-known/jwks.json:
    get:
      tags:
      - auth
      summary: Get Jwks
      description: "Exposes current and previous public RSA keys in standard JWKS\
        \ format (RULES \xA78)."
      operationId: get_jwks__well_known_jwks_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    CurrentPrincipalResponse:
      properties:
        principal_id:
          type: string
          format: uuid
          title: Principal Id
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        mobile_e164:
          anyOf:
          - type: string
          - type: 'null'
          title: Mobile E164
        status:
          type: string
          title: Status
        roles:
          items:
            type: string
          type: array
          title: Roles
        tenant_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Tenant Ids
        store_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Store Ids
        assignments:
          items:
            $ref: '#/components/schemas/RoleAssignmentResponse'
          type: array
          title: Assignments
      additionalProperties: false
      type: object
      required:
      - principal_id
      - status
      title: CurrentPrincipalResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JwksResponse:
      properties:
        keys:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Keys
      additionalProperties: false
      type: object
      required:
      - keys
      title: JwksResponse
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
      additionalProperties: false
      type: object
      required:
      - email
      - password
      title: LoginRequest
    LogoutResponse:
      properties:
        status:
          type: string
          title: Status
          default: revoked
      additionalProperties: false
      type: object
      title: LogoutResponse
    OtpChallengeRequest:
      properties:
        channel:
          type: string
          pattern: ^(EMAIL|SMS)$
          title: Channel
        destination:
          type: string
          maxLength: 255
          minLength: 3
          title: Destination
        purpose:
          type: string
          pattern: ^(ACCOUNT_CLAIM|STEP_UP_AUTH|VERIFICATION)$
          title: Purpose
      additionalProperties: false
      type: object
      required:
      - channel
      - destination
      - purpose
      title: OtpChallengeRequest
    OtpChallengeResponse:
      properties:
        challenge_id:
          type: string
          format: uuid
          title: Challenge Id
        channel:
          type: string
          title: Channel
        purpose:
          type: string
          title: Purpose
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - challenge_id
      - channel
      - purpose
      - expires_at
      title: OtpChallengeResponse
    OtpVerifyRequest:
      properties:
        otp_code:
          type: string
          maxLength: 10
          minLength: 4
          title: Otp Code
      additionalProperties: false
      type: object
      required:
      - otp_code
      title: OtpVerifyRequest
    OtpVerifyResponse:
      properties:
        challenge_id:
          type: string
          format: uuid
          title: Challenge Id
        verified:
          type: boolean
          title: Verified
        purpose:
          type: string
          title: Purpose
      additionalProperties: false
      type: object
      required:
      - challenge_id
      - verified
      - purpose
      title: OtpVerifyResponse
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 256
          minLength: 16
          title: Refresh Token
      additionalProperties: false
      type: object
      required:
      - refresh_token
      title: RefreshRequest
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
        mobile_e164:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Mobile E164
      additionalProperties: false
      type: object
      required:
      - email
      - password
      title: RegisterRequest
    RegisterResponse:
      properties:
        principal_id:
          type: string
          format: uuid
          title: Principal Id
        email:
          type: string
          title: Email
        status:
          type: string
          title: Status
      additionalProperties: false
      type: object
      required:
      - principal_id
      - email
      - status
      title: RegisterResponse
    RoleAssignmentCreateRequest:
      properties:
        principal_id:
          type: string
          format: uuid
          title: Principal Id
        role_code:
          type: string
          pattern: ^(PLATFORM_OWNER|PLATFORM_STAFF|GST_STAFF|STORE_OWNER|STORE_STAFF|GUARDIAN|CUSTOMER|SERVICE)$
          title: Role Code
        tenant_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Tenant Id
        store_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Store Id
        valid_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid Until
      additionalProperties: false
      type: object
      required:
      - principal_id
      - role_code
      title: RoleAssignmentCreateRequest
    RoleAssignmentResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        principal_id:
          type: string
          format: uuid
          title: Principal Id
        role_code:
          type: string
          title: Role Code
        tenant_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Tenant Id
        store_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Store Id
        valid_from:
          type: string
          format: date-time
          title: Valid From
        valid_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid Until
      additionalProperties: false
      type: object
      required:
      - id
      - principal_id
      - role_code
      - valid_from
      title: RoleAssignmentResponse
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: Bearer
        expires_in:
          type: integer
          title: Expires In
      additionalProperties: false
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      title: TokenResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
