components:
  schemas:
    CatalogItemDetailResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        store_id:
          type: string
          format: uuid
          title: Store Id
        item_type:
          type: string
          title: Item Type
        price:
          type: string
          title: Price
        currency_code:
          type: string
          title: Currency Code
        active:
          type: boolean
          title: Active
        live_version_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Live Version Id
        draft_version_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Draft Version Id
        live_version:
          anyOf:
          - $ref: '#/components/schemas/ItemVersionDetail'
          - type: 'null'
        draft_version:
          anyOf:
          - $ref: '#/components/schemas/ItemVersionDetail'
          - type: 'null'
        is_digital:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Digital
        sku_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Sku Code
        is_appointment:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Appointment
        duration_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Minutes
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
      - id
      - tenant_id
      - store_id
      - item_type
      - price
      - currency_code
      - active
      - created_at
      - updated_at
      title: CatalogItemDetailResponse
    CatalogItemSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        store_id:
          type: string
          format: uuid
          title: Store Id
        item_type:
          type: string
          title: Item Type
        price:
          type: string
          title: Price
        currency_code:
          type: string
          title: Currency Code
        active:
          type: boolean
          title: Active
        live_version_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Live Version Id
        draft_version_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Draft Version Id
        title:
          type: string
          title: Title
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - tenant_id
      - store_id
      - item_type
      - price
      - currency_code
      - active
      - title
      - created_at
      title: CatalogItemSummary
    CreateCatalogItemRequest:
      properties:
        item_type:
          type: string
          maxLength: 32
          title: Item Type
        operational:
          $ref: '#/components/schemas/OperationalInput'
        draft:
          $ref: '#/components/schemas/DraftVersionInput'
        product_details:
          anyOf:
          - $ref: '#/components/schemas/ProductDetailsInput'
          - type: 'null'
        service_details:
          anyOf:
          - $ref: '#/components/schemas/ServiceDetailsInput'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - item_type
      - operational
      - draft
      title: CreateCatalogItemRequest
    CreateCatalogItemResponse:
      properties:
        item_id:
          type: string
          format: uuid
          title: Item Id
        draft_version_id:
          type: string
          format: uuid
          title: Draft Version Id
        approval_state:
          type: string
          title: Approval State
          default: DRAFT
      additionalProperties: false
      type: object
      required:
      - item_id
      - draft_version_id
      title: CreateCatalogItemResponse
    CreateMediaUploadIntentRequest:
      properties:
        item_version_id:
          type: string
          format: uuid
          title: Item Version Id
        filename:
          type: string
          maxLength: 255
          minLength: 1
          title: Filename
        media_type:
          type: string
          maxLength: 16
          title: Media Type
      additionalProperties: false
      type: object
      required:
      - item_version_id
      - filename
      - media_type
      title: CreateMediaUploadIntentRequest
    CreateMediaUploadIntentResponse:
      properties:
        media_id:
          type: string
          format: uuid
          title: Media Id
        storage_key:
          type: string
          title: Storage Key
        upload_url:
          type: string
          title: Upload Url
        public_url:
          type: string
          title: Public Url
      additionalProperties: false
      type: object
      required:
      - media_id
      - storage_key
      - upload_url
      - public_url
      title: CreateMediaUploadIntentResponse
    CreateVersionRequest:
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 1
          title: Title
        description:
          type: string
          maxLength: 10000
          title: Description
          default: ''
        category_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Category Id
      additionalProperties: false
      type: object
      required:
      - title
      title: CreateVersionRequest
    CreateVersionResponse:
      properties:
        version_id:
          type: string
          format: uuid
          title: Version Id
        item_id:
          type: string
          format: uuid
          title: Item Id
        version_no:
          type: integer
          title: Version No
        approval_state:
          type: string
          title: Approval State
          default: DRAFT
        title:
          type: string
          title: Title
      additionalProperties: false
      type: object
      required:
      - version_id
      - item_id
      - version_no
      - title
      title: CreateVersionResponse
    DraftVersionInput:
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 1
          title: Title
        description:
          type: string
          maxLength: 10000
          title: Description
          default: ''
        category_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Category Id
      additionalProperties: false
      type: object
      required:
      - title
      title: DraftVersionInput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ItemVersionDetail:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        version_no:
          type: integer
          title: Version No
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        category_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Category Id
        approval_state:
          type: string
          title: Approval State
        approval_request_id:
          anyOf:
          - type: string
