openapi: 3.1.0
info:
  title: KarobarOne CATALOG Service
  version: 0.1.0
paths:
  /health/live:
    get:
      summary: Health Live
      description: "Liveness probe returning 200 OK (RULES.md \xA71 C2)."
      operationId: health_live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      summary: Health Ready
      description: "Readiness probe verifying DB connectivity (RULES.md \xA71 C2)."
      operationId: health_ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /internal/events:
    post:
      summary: Receive Internal Event
      description: Ingress endpoint for cross-service events per SECURITY_LAYER.md.
      operationId: receive_internal_event_internal_events_post
      parameters:
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
