# render.yaml — Render Blueprint for KarobarOne Microservices Architecture
# Source: DEPLOY.md §4.2, SERVICES.md
services:
  # ----------------------------------------------------------------------------
  # Gateway (Public Facing)
  # ----------------------------------------------------------------------------
  - type: web
    name: karobar-gateway
    runtime: docker
    dockerfilePath: ./services/gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: GATEWAY_API_KEYS
        sync: false
      - key: UPSTREAM_IAM_URL
        fromService: {type: pserv, name: karobar-iam, property: hostport}
      - key: UPSTREAM_TENANT_URL
        fromService: {type: pserv, name: karobar-tenant, property: hostport}
      - key: UPSTREAM_APPROVAL_URL
        fromService: {type: pserv, name: karobar-approval, property: hostport}
      - key: UPSTREAM_CATALOG_URL
        fromService: {type: pserv, name: karobar-catalog, property: hostport}
      - key: UPSTREAM_DOMAIN_URL
        fromService: {type: pserv, name: karobar-domain, property: hostport}
      - key: UPSTREAM_CUSTOMER_URL
        fromService: {type: pserv, name: karobar-customer, property: hostport}
      - key: UPSTREAM_SUBSCRIPTION_URL
        fromService: {type: pserv, name: karobar-subscription, property: hostport}
      - key: UPSTREAM_INVENTORY_URL
        fromService: {type: pserv, name: karobar-inventory, property: hostport}
      - key: UPSTREAM_MONOLITH_URL
        sync: false

  # ----------------------------------------------------------------------------
  # 1. IAM Service & Worker
  # ----------------------------------------------------------------------------
  - type: pserv
    name: karobar-iam
    runtime: docker
    dockerfilePath: ./services/iam/Dockerfile
    dockerContext: .
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: SERVICE_NAME
        value: iam
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: MY_SERVICE_KEY
        sync: false
      - key: SERVICE_KEY_HASHES
        sync: false

  - type: worker
    name: karobar-iam-worker
    runtime: docker
    dockerfilePath: ./services/iam/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: SERVICE_NAME
        value: iam
      - key: DATABASE_URL
        sync: false
      - key: MY_SERVICE_KEY
        sync: false
      - key: SERVICE_KEY_HASHES
        sync: false

