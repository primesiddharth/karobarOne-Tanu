              - INVALID_STATE_TRANSITION
              - TENANT_PAN_ALREADY_REGISTERED
              - FREE_STORE_ENTITLEMENT_CONSUMED
              - GSTIN_REQUIRED
              - GSTIN_NOT_OWNED
              - GSTIN_ALREADY_USED
              - GUARDIAN_REQUIRED
              - ENTITLEMENT_REQUIRED
              - COMMERCE_SUSPENDED
              - SUBSCRIPTION_EXPIRED
              - CROSS_STORE_CHECKOUT_NOT_ALLOWED
              - MIXED_CHECKOUT_NOT_ALLOWED
              - INSUFFICIENT_INVENTORY
              - CAPACITY_UNAVAILABLE
              - PAYMENT_NOT_CONFIRMED
              - UPI_NOT_SUPPORTED
              - CUSTOM_DOMAIN_REQUIRED
              - CONTENT_APPROVAL_REQUIRED
              - CANCELLATION_WINDOW_CLOSED
              - UPGRADE_APPROVAL_REQUIRED
              - REFUND_NOT_ALLOWED
              - IDEMPOTENCY_CONFLICT
              - STALE_VERSION
              - RATE_LIMITED
              - DEPENDENCY_UNAVAILABLE
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
              format: uuid
          additionalProperties: false
          required:
          - code
          - message
          - request_id
      additionalProperties: false
      required:
      - error
    Money:
      type: object
      properties:
        amount:
          type: string
          pattern: ^-?\d+(?:\.\d{1,2})?$
