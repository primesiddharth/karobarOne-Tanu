openapi: 3.1.0
info:
  title: KarobarOne REST API V1
  version: 1.0.0
  description: Machine-readable contract derived from KarobarOne REST API & Kafka Event Contract Specification V1.0. Business
    rules remain governed by BRD V2.1 and the State Machine specification.
servers:
- url: /api/v1
  description: Relative API base path; deployment host is environment-specific.
tags:
- name: IAM
  description: Identity & Access
- name: TEN
  description: Tenant & Store
- name: SUB
  description: Subscription & Entitlement
- name: DOM
  description: Domain & Publication
- name: CAT
  description: Catalog & CMS
- name: APR
  description: Approval & Governance
- name: CUS
  description: Customer
- name: INV
  description: Inventory
- name: COM
  description: Commerce
- name: BKG
  description: Booking
- name: PAY
  description: Payment Integration
- name: FUL
  description: Fulfilment
- name: FIN
  description: Commission & Finance
- name: CMP
  description: Compliance, GST & Risk
- name: NTF
  description: Notification
- name: ANL
  description: Analytics & AI
paths:
  /auth/login:
    post:
      tags:
      - IAM
      operationId: IAM_001
      summary: Authenticate principal
      description: 'Contract ID IAM-001. Actor: PUBLIC. Primary emitted fact(s): identity.security-event.recorded.v1.'
      x-contract-id: IAM-001
      x-actor: PUBLIC
      x-idempotency: 'No'
      x-emits:
      - identity.security-event.recorded.v1
      x-event-registry-status: registered-or-none
      x-contract-status: registry-only
      security: []
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Optional request UUID; server generates one if absent/invalid.
      responses:
        '200':
          description: Success / durably accepted per operation semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryObject'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /auth/refresh:
    post:
      tags:
      - IAM
      operationId: IAM_002
      summary: Rotate refresh session
      description: 'Contract ID IAM-002. Actor: Authenticated session. Primary emitted fact(s): identity.session.refreshed.v1.'
      x-contract-id: IAM-002
      x-actor: Authenticated session
      x-idempotency: 'Yes'
      x-emits:
      - identity.session.refreshed.v1
      x-event-registry-status: source-gap
      x-event-registry-missing:
      - identity.session.refreshed.v1
      x-contract-status: registry-only
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Opaque retry key. Same key with a different request hash is rejected with IDEMPOTENCY_CONFLICT.
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Optional request UUID; server generates one if absent/invalid.
      responses:
        '200':
          description: Success / durably accepted per operation semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryObject'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /auth/logout:
    post:
      tags:
      - IAM
      operationId: IAM_003
      summary: Revoke current session
      description: 'Contract ID IAM-003. Actor: Authenticated. Primary emitted fact(s): identity.session.revoked.v1.'
      x-contract-id: IAM-003
      x-actor: Authenticated
      x-idempotency: 'Yes'
      x-emits:
