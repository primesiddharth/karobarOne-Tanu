        currency_code:
          type: string
          default: INR
      additionalProperties: false
      required:
      - amount
      - currency_code
    ResourceMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        store_id:
          type:
