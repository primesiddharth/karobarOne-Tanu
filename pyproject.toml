[project]
name = "karobarone-microservices"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E501",    # Line too long
    "E741",    # Ambiguous variable name
    "E712",    # Comparison to True/False in SQLAlchemy queries
    "F541",    # f-string without placeholders
    "F841",    # Local variable assigned but unused
    "B008",    # FastAPI Depends() in argument defaults
    "RUF012",  # Mutable class attributes
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"conftest.py" = ["E402", "F401"]
"**/migrations/**" = ["E402", "F401"]
"**/tests/**" = ["E402", "F401", "F841"]
"tools/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"