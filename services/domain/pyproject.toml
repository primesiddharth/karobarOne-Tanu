[project]
name = "karobarone-domain"
version = "0.1.0"
description = "KarobarOne Domain & Publication microservice conforming to KarobarOne specs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "cryptography>=43.0.3",
    "pyjwt[crypto]>=2.9.0",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
