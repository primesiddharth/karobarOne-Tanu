[project]
name = "karobarone-iam"
version = "0.1.0"
description = "KarobarOne Identity & Access Management Service"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.5",
    "argon2-cffi>=23.1.0",
    # bcrypt allowed in IAM ONLY for verify-then-rehash of legacy passwords (OQ-008, RULES §2); remove after cutover
    "bcrypt>=4.1.2",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
]
