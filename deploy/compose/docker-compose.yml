      IAM_SERVICE_URL: http://iam-api:8000
      TENANT_SERVICE_URL: http://tenant-api:8000
      APPROVAL_SERVICE_URL: http://approval-api:8000
      CATALOG_SERVICE_URL: http://catalog-api:8000
      DOMAIN_SERVICE_URL: http://domain-api:8000
      CUSTOMER_SERVICE_URL: http://customer-api:8000
      SUBSCRIPTION_SERVICE_URL: http://subscription-api:8000
