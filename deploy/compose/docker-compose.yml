services:
  postgres:
    image: postgres:16-alpine
    container_name: karobarone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_postgres_password
      POSTGRES_DB: karobarone_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../tools/db/bootstrap.sql:/docker-entrypoint-initdb.d/01_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karobarone_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO S3-compatible local object storage (KarobarOne Foundation Spec §11, Integration Spec §14)
  minio:
    image: quay.io/minio/minio:latest
    container_name: karobarone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: karobarone-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadminpassword; do
        echo 'Waiting for MinIO connection...';
        sleep 1;
      done;
      mc mb --ignore-existing local/karobarone-media;
      mc anonymous set none local/karobarone-media;
      echo 'Bucket karobarone-media provisioned successfully.';
      exit 0;
      "

  iam-api:
    build:
      context: ../..
      dockerfile: services/iam/Dockerfile
    container_name: karobarone-iam-api
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: dev
      SERVICE_NAME: iam
      RUNNING_IN_DOCKER: "1"
      DATABASE_URL: postgresql+asyncpg://iam_svc:dev_svc_secret@postgres:5432/karobarone_dev
      MIGRATION_DATABASE_URL: postgresql+asyncpg://iam_migrator:dev_migrator_secret@postgres:5432/karobarone_dev
      MY_SERVICE_KEY: dev_secret_key_iam
      IAM_SERVICE_URL: http://iam-api:8000
      TENANT_SERVICE_URL: http://tenant-api:8000
      APPROVAL_SERVICE_URL: http://approval-api:8000
      CATALOG_SERVICE_URL: http://catalog-api:8000
      DOMAIN_SERVICE_URL: http://domain-api:8000
      CUSTOMER_SERVICE_URL: http://customer-api:8000
      SUBSCRIPTION_SERVICE_URL: http://subscription-api:8000
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  iam-worker:
    build:
      context: ../..
      dockerfile: services/iam/Dockerfile
    container_name: karobarone-iam-worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: dev
      SERVICE_NAME: iam
      RUNNING_IN_DOCKER: "1"
      DATABASE_URL: postgresql+asyncpg://iam_svc:dev_svc_secret@postgres:5432/karobarone_dev
      MY_SERVICE_KEY: dev_secret_key_iam
      IAM_SERVICE_URL: http://iam-api:8000
      TENANT_SERVICE_URL: http://tenant-api:8000
      APPROVAL_SERVICE_URL: http://approval-api:8000
      CATALOG_SERVICE_URL: http://catalog-api:8000
      DOMAIN_SERVICE_URL: http://domain-api:8000
      CUSTOMER_SERVICE_URL: http://customer-api:8000
      SUBSCRIPTION_SERVICE_URL: http://subscription-api:8000
    depends_on:
      iam-api:
        condition: service_healthy

  tenant-api:
