apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: karobar-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: karobar-platform
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: karobarone
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: karobar-platform
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: karobarone
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: karobarone
    spec:
      serviceAccountName: gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: karobarone/gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "prod"
            - name: LOG_LEVEL
              value: "INFO"
            - name: UPSTREAM_IAM_URL
              value: "http://iam:8000"
            - name: UPSTREAM_TENANT_URL
              value: "http://tenant:8000"
            - name: UPSTREAM_APPROVAL_URL
              value: "http://approval:8000"
            - name: UPSTREAM_CATALOG_URL
              value: "http://catalog:8000"
            - name: UPSTREAM_DOMAIN_URL
              value: "http://domain:8000"
            - name: UPSTREAM_CUSTOMER_URL
              value: "http://customer:8000"
            - name: UPSTREAM_SUBSCRIPTION_URL
              value: "http://subscription:8000"
            - name: UPSTREAM_INVENTORY_URL
              value: "http://inventory:8000"
            - name: GATEWAY_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: GATEWAY_API_KEYS
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: karobar-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: api.karobarone.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: karobar-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: karobar-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
