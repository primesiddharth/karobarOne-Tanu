apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-sa
  namespace: karobar-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: karobar-platform
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: karobarone
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: catalog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: karobar-platform
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: karobarone
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: karobarone
    spec:
      serviceAccountName: catalog-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-api
          image: karobarone/catalog:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "catalog"
            - name: ENVIRONMENT
              value: "prod"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: DATABASE_URL
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: JWT_PUBLIC_KEY
            - name: MY_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: MY_SERVICE_KEY
            - name: SERVICE_KEY_HASHES
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: SERVICE_KEY_HASHES
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_ENDPOINT
                  optional: true
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_ACCESS_KEY
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_SECRET_KEY
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_BUCKET
                  optional: true
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_REGION
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-worker
  namespace: karobar-platform
  labels:
    app.kubernetes.io/name: catalog-worker
    app.kubernetes.io/part-of: karobarone
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-worker
        app.kubernetes.io/part-of: karobarone
    spec:
      serviceAccountName: catalog-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-worker
          image: karobarone/catalog:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SERVICE_NAME
              value: "catalog"
            - name: ENVIRONMENT
              value: "prod"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: DATABASE_URL
            - name: MY_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: MY_SERVICE_KEY
            - name: SERVICE_KEY_HASHES
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: SERVICE_KEY_HASHES
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_ENDPOINT
                  optional: true
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_ACCESS_KEY
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_SECRET_KEY
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_BUCKET
                  optional: true
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: S3_REGION
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-pdb
  namespace: karobar-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-hpa
  namespace: karobar-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
