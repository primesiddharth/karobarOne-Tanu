apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: karobar-platform

resources:
  - ../../base
  - postgres-kind.yaml
  - minio-kind.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: .*

secretGenerator:
  - name: gateway-secrets
    literals:
      - GATEWAY_API_KEYS=dev-gateway-key-hash
  - name: iam-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://iam_svc:devpassword123@postgres:5432/karobarone
      - MIGRATION_DATABASE_URL=postgresql://iam_migrator:devpassword123@postgres:5432/karobarone
      - JWT_PRIVATE_KEY=dev-jwt-private-key-sample
      - JWT_PUBLIC_KEY=dev-jwt-public-key-sample
      - MY_SERVICE_KEY=dev-iam-key
      - SERVICE_KEY_HASHES=dev-hashes
  - name: tenant-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://tenant_svc:devpassword123@postgres:5432/karobarone
      - MIGRATION_DATABASE_URL=postgresql://tenant_migrator:devpassword123@postgres:5432/karobarone
      - PAN_ENC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - PAN_FP_KEY=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
      - JWT_PUBLIC_KEY=dev-jwt-public-key-sample
      - MY_SERVICE_KEY=dev-tenant-key
      - SERVICE_KEY_HASHES=dev-hashes
  - name: approval-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://approval_svc:devpassword123@postgres:5432/karobarone
      - MIGRATION_DATABASE_URL=postgresql://approval_migrator:devpassword123@postgres:5432/karobarone
      - JWT_PUBLIC_KEY=dev-jwt-public-key-sample
      - MY_SERVICE_KEY=dev-approval-key
      - SERVICE_KEY_HASHES=dev-hashes
  - name: catalog-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://catalog_svc:devpassword123@postgres:5432/karobarone
      - MIGRATION_DATABASE_URL=postgresql://catalog_migrator:devpassword123@postgres:5432/karobarone
      - JWT_PUBLIC_KEY=dev-jwt-public-key-sample
      - MY_SERVICE_KEY=dev-catalog-key
      - SERVICE_KEY_HASHES=dev-hashes
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadminpassword
      - S3_BUCKET=karobarone-media
      - S3_REGION=us-east-1
  - name: domain-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://domain_svc:devpassword123@postgres:5432/karobarone
      - MIGRATION_DATABASE_URL=postgresql://domain_migrator:devpassword123@postgres:5432/karobarone
      - JWT_PUBLIC_KEY=dev-jwt-public-key-sample
      - MY_SERVICE_KEY=dev-domain-key
      - SERVICE_KEY_HASHES=dev-hashes
  - name: customer-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://customer_svc:devpassword123@postgres:5432/karobarone
      - MIGRATION_DATABASE_URL=postgresql://customer_migrator:devpassword123@postgres:5432/karobarone
      - JWT_PUBLIC_KEY=dev-jwt-public-key-sample
      - MY_SERVICE_KEY=dev-customer-key
      - SERVICE_KEY_HASHES=dev-hashes
  - name: subscription-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://subscription_svc:devpassword123@postgres:5432/karobarone
      - MIGRATION_DATABASE_URL=postgresql://subscription_migrator:devpassword123@postgres:5432/karobarone
      - JWT_PUBLIC_KEY=dev-jwt-public-key-sample
      - MY_SERVICE_KEY=dev-subscription-key
      - SERVICE_KEY_HASHES=dev-hashes
  - name: inventory-secrets
    literals:
      - DATABASE_URL=postgresql+asyncpg://inventory_svc:devpassword123@postgres:5432/karobarone
      - MIGRATION_DATABASE_URL=postgresql://inventory_migrator:devpassword123@postgres:5432/karobarone
      - JWT_PUBLIC_KEY=dev-jwt-public-key-sample
      - MY_SERVICE_KEY=dev-inventory-key
      - SERVICE_KEY_HASHES=dev-hashes
