apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: karobar-platform

resources:
  - ../../base

images:
  - name: karobarone/gateway
    newTag: v1.0.0
  - name: karobarone/iam
    newTag: v1.0.0
  - name: karobarone/tenant
    newTag: v1.0.0
  - name: karobarone/approval
    newTag: v1.0.0
  - name: karobarone/catalog
    newTag: v1.0.0
  - name: karobarone/domain
    newTag: v1.0.0
  - name: karobarone/customer
    newTag: v1.0.0
  - name: karobarone/subscription
    newTag: v1.0.0
  - name: karobarone/inventory
    newTag: v1.0.0

patches:
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.karobarone.com
    target:
      kind: Ingress
      name: gateway-ingress
