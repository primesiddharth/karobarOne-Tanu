name: Microservices CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "ruff==0.15.21" \
            "mypy==1.19.1" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "fastapi==0.139.0" \
            "pydantic[email]==2.13.4" \
            "pydantic-settings==2.14.2" \
            "email-validator>=2.0.0" \
            "structlog==26.1.0" \
            "pyjwt==2.13.0" \
            "cryptography==49.0.0" \
            "httpx==0.28.1" \
            "pyyaml==6.0.3" \
            "types-PyYAML" \
            "sqlalchemy==2.0.51" \
            "asyncpg==0.31.0" \
            "boto3>=1.34.0"

      - name: Run Ruff
        run: ruff check .

      - name: Run Mypy
        env:
          MYPYPATH: .
        run: mypy libs/platform_contracts tools/

  test:
    name: Test & AC Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev_postgres_password
          POSTGRES_DB: karobarone_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5


    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi==0.139.0" \
            "uvicorn[standard]==0.51.0" \
            "sqlalchemy==2.0.51" \
            "asyncpg==0.31.0" \
            "pydantic[email]==2.13.4" \
            "pydantic-settings==2.14.2" \
            "email-validator>=2.0.0" \
            "alembic==1.18.5" \
            "pyjwt==2.13.0" \
            "cryptography==49.0.0" \
            "httpx==0.28.1" \
            "structlog==26.1.0" \
            "argon2-cffi>=23.1.0" \
            "bcrypt>=4.1.2" \
            "testcontainers==4.14.2" \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pyyaml==6.0.3"

      - name: Bootstrap Database
        run: |
          PGPASSWORD=dev_postgres_password psql -h localhost -U postgres -d karobarone_dev -f tools/db/bootstrap.sql

      - name: Run Acceptance Criteria Coverage Check
        run: python tools/check_ac_coverage.py

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:dev_postgres_password@localhost:5432/karobarone_dev
          MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:dev_postgres_password@localhost:5432/karobarone_dev
        run: |
          pytest libs/platform_contracts tools/tests/ services/iam/tests/ -v
